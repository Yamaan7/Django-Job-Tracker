{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="{% static 'admin/img/favicon.ico' %}"
      type="image/x-icon"
    />
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #25313c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 0;
      }
      header {
        background: #1f4b66;
        color: white;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      header a {
        color: white;
        text-decoration: none;
        font-size: 1.25rem;
        font-weight: bold;
      }
      .primary-nav {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .primary-nav a {
        border-radius: 4px;
        font-size: 0.95rem;
        padding: 0.55rem 0.75rem;
      }
      .primary-nav a.active,
      .primary-nav a:hover {
        background: #ffffff24;
      }
      main {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
        width: 100%;
      }
      main.wide-main {
        max-width: 1760px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0;
        font-size: 1.7rem;
        line-height: 1.2;
      }
      .page-title {
        margin-bottom: 1.5rem;
      }
      .button {
        display: inline-block;
        background: #287d55;
        color: white;
        border: 0;
        border-radius: 4px;
        padding: 0.65rem 1rem;
        text-decoration: none;
        cursor: pointer;
        font-size: 0.95rem;
        text-align: center;
      }
      .button.secondary {
        background: #66727c;
      }
      .button.danger {
        background: #b13b3b;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        margin: 1.25rem 0;
        background: #d6dadd;
        border: 1px solid #d6dadd;
      }
      .metric {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.1rem;
        background: white;
      }
      .metric span {
        color: #58656f;
        font-size: 0.9rem;
      }
      .metric strong {
        color: #1f4b66;
        font-size: 1.5rem;
        font-variant-numeric: tabular-nums;
      }
      .dashboard.five-metrics {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .company-profile {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        margin: 1.25rem 0;
        border: 1px solid #d6dadd;
        background: #d6dadd;
      }
      .company-profile div {
        min-width: 0;
        padding: 0.85rem 1rem;
        background: white;
        overflow-wrap: anywhere;
      }
      .company-profile dt {
        margin-bottom: 0.3rem;
        color: #58656f;
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: uppercase;
      }
      .company-profile dd {
        margin: 0;
      }
      .company-description {
        margin-top: 1.25rem;
        padding: 1rem 1.25rem;
        border: 1px solid #d6dadd;
        background: white;
        overflow-wrap: anywhere;
      }
      .company-description h2 {
        margin: 0 0 0.75rem;
        font-size: 1.15rem;
      }
      .company-description p {
        margin: 0;
      }
      .status-badge {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        border-radius: 3px;
        background: #e9eef1;
        color: #25313c;
        white-space: nowrap;
      }
      .status-badge.contacted {
        background: #e4f2e9;
        color: #205d3e;
      }
      .follow-up-overdue {
        color: #9c3030;
        font-weight: bold;
      }
      .muted {
        color: #66727c;
      }
      .filters {
        display: grid;
        grid-template-columns:
          minmax(280px, 2fr) repeat(3, minmax(170px, 1fr))
          auto;
        align-items: end;
        gap: 0.9rem;
        max-width: none;
        margin-bottom: 1.25rem;
        padding: 1.1rem;
        border: 1px solid #d6dadd;
        background: white;
      }
      .filters .filter-field {
        display: grid;
        align-content: end;
        gap: 0.4rem;
        min-width: 0;
      }
      .filters .filter-field label {
        margin: 0;
        color: #46545e;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .filters input,
      .filters select {
        width: 100%;
        height: 2.7rem;
        padding: 0.55rem 0.7rem;
        border: 1px solid #bcc6cc;
        border-radius: 4px;
        background: white;
        color: #25313c;
        font: inherit;
      }
      .filters input:focus,
      .filters select:focus {
        border-color: #287d55;
        outline: 2px solid #287d5533;
      }
      .filters .filters-reset {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.7rem;
        white-space: nowrap;
      }
      .sort-options {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .sort-options legend {
        margin: 0 0 0.35rem;
        font-size: 0.85rem;
        font-weight: bold;
      }
      .sort-buttons {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid #aeb9c0;
        border-radius: 4px;
        vertical-align: middle;
      }
      .sort-option {
        min-height: 2.4rem;
        padding: 0.55rem 0.75rem;
        border: 0;
        background: white;
        color: #25313c;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .sort-option + .sort-option {
        border-left: 1px solid #aeb9c0;
      }
      .sort-option.active {
        background: #1f4b66;
        color: white;
      }
      .sort-option:focus-visible {
        outline: 2px solid #287d55;
        outline-offset: -3px;
      }
      table {
        width: 100%;
        min-width: 0;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 1px 4px #d6dadd;
      }
      th,
      td {
        text-align: left;
        padding: 0.8rem;
        border-bottom: 1px solid #e5e8eb;
      }
      th {
        background: #e9eef1;
        font-size: 0.9rem;
      }
      .company-table-wrap {
        width: 100%;
        border: 1px solid #d6dadd;
        background: white;
      }
      .company-table {
        width: 100%;
        table-layout: auto;
        box-shadow: none;
      }
      .company-table th,
      .company-table td {
        padding: 0.8rem 0.75rem;
        border: 1px solid #d6dadd;
        vertical-align: middle;
        overflow-wrap: anywhere;
      }
      .company-table .company-contact-cell > div {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        min-width: 0;
      }
      .company-table .company-contact-cell span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .company-table .company-contact-empty {
        color: #66727c;
        text-align: center;
      }
      .company-table .copy-control {
        flex: 0 0 2rem;
      }
      .company-table .company-number,
      .company-table .actions {
        text-align: center;
        white-space: nowrap;
      }
      td.actions {
        white-space: normal;
      }
      .actions a {
        display: inline-block;
        margin: 0 0.4rem 0.25rem 0;
      }
      form {
        background: white;
        width: 100%;
        max-width: 560px;
        padding: 1.5rem;
        box-shadow: 0 1px 4px #d6dadd;
      }
      form p {
        margin: 0 0 1rem;
      }
      form.company-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
      form.company-form p {
        min-width: 0;
        margin: 0;
      }
      form.company-form p:has(textarea) {
        grid-column: 1 / -1;
      }
      form.company-form .form-actions {
        grid-column: 1 / -1;
      }
      form.company-form label {
        display: block;
        margin: 0 0 0.4rem;
        font-weight: bold;
      }
      form.company-form input,
      form.company-form select,
      form.company-form textarea {
        display: block;
        width: 100%;
        padding: 0.65rem;
        border: 1px solid #bcc6cc;
        border-radius: 4px;
        font: inherit;
      }
      form.company-form input,
      form.company-form select {
        height: 2.7rem;
      }
      form.company-form textarea {
        min-height: 6rem;
        line-height: 1.4;
        resize: vertical;
      }
      form.company-form .helptext {
        display: block;
        margin-top: 0.35rem;
        color: #66727c;
        font-size: 0.85rem;
      }
      .errorlist {
        color: #b13b3b;
        padding-left: 1.2rem;
      }
      .form-actions {
        margin-top: 1.5rem;
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .copy-control {
        display: inline-grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 1px solid #c7d0d5;
        border-radius: 4px;
        background: white;
        color: #31596c;
        cursor: pointer;
        vertical-align: middle;
      }
      .copy-control svg {
        width: 1rem;
        height: 1rem;
      }
      .copy-control:hover,
      .copy-control:focus-visible {
        background: #e9eef1;
        outline: 2px solid #287d55;
        outline-offset: 1px;
      }
      .copy-control.copied {
        color: #205d3e;
      }
      .empty {
        background: white;
        padding: 2rem;
        text-align: center;
      }
      @media (max-width: 700px) {
        header {
          padding: 1rem;
          flex-wrap: wrap;
        }
        .primary-nav {
          width: 100%;
          margin: -0.35rem 0 0 -0.4rem;
        }
        main {
          margin: 1.25rem auto 0;
          padding-left: 0.75rem;
          padding-right: 0.75rem;
        }
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .toolbar .button {
          width: 100%;
        }
        .filters {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .filters .filter-search {
          grid-column: 1 / -1;
        }
        .sort-options {
          grid-column: 1 / -1;
        }
        table,
        tbody,
        tr,
        td {
          display: block;
          width: 100%;
        }
        table {
          background: transparent;
          box-shadow: none;
        }
        thead {
          display: none;
        }
        tr {
          background: white;
          box-shadow: 0 1px 4px #d6dadd;
          margin-bottom: 1rem;
          padding: 0.75rem 1rem;
        }
        td {
          align-items: baseline;
          border-bottom: 1px solid #e5e8eb;
          display: flex;
          gap: 0.75rem;
          justify-content: space-between;
          padding: 0.65rem 0;
          text-align: right;
          overflow-wrap: anywhere;
        }
        td::before {
          color: #66727c;
          content: attr(data-label);
          flex: 0 0 38%;
          font-size: 0.8rem;
          font-weight: bold;
          text-align: left;
          text-transform: uppercase;
        }
        td:last-child {
          border-bottom: 0;
          display: block;
          padding-bottom: 0.1rem;
          text-align: left;
        }
        td:last-child::before {
          display: block;
          margin-bottom: 0.4rem;
        }
        td.actions a {
          margin-bottom: 0;
        }
        .empty {
          padding: 1.5rem 1rem;
        }
      }
      @media (max-width: 400px) {
        main {
          padding-left: 0.5rem;
          padding-right: 0.5rem;
        }
        form {
          padding: 1rem;
        }
        .form-actions .button {
          flex: 1 1 100%;
          width: 100%;
        }
        h1 {
          font-size: 1.45rem;
        }
        .dashboard {
          grid-template-columns: 1fr;
        }
        .dashboard.five-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .company-profile {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .metric {
          padding: 0.75rem 1rem;
        }
        .filters {
          gap: 0.75rem;
          padding: 0.75rem;
        }
        .sort-options {
          min-width: 0;
        }
        .filter-field {
          width: 100%;
        }
        .filters .filters-reset {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 560px) {
        form.company-form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="{% url 'application_list' %}">Job Tracker</a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a
          href="{% url 'application_list' %}"
          class="{% if request.resolver_match.url_name == 'application_list' or request.resolver_match.url_name == 'application_create' or request.resolver_match.url_name == 'application_update' or request.resolver_match.url_name == 'application_delete' %}active{% endif %}"
          >Applications</a
        >
        <a
          href="{% url 'company_list' %}"
          class="{% if request.resolver_match.url_name == 'company_list' or request.resolver_match.url_name == 'company_create' or request.resolver_match.url_name == 'company_detail' or request.resolver_match.url_name == 'company_update' or request.resolver_match.url_name == 'company_delete' or request.resolver_match.url_name == 'contact_create' or request.resolver_match.url_name == 'contact_update' or request.resolver_match.url_name == 'contact_delete' %}active{% endif %}"
          >Companies</a
        >
      </nav>
    </header>
    <main class="{% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <script>
      function fallbackCopy(text) {
        const field = document.createElement("textarea");
        field.value = text;
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        return copied;
      }

      function companyRowText(button) {
        const row = button.closest("tr");
        const headers = Array.from(
          row.closest("table").querySelectorAll("thead th"),
        );
        const cells = Array.from(row.cells).slice(0, -1);
        return cells
          .map((cell, index) => {
            const content = cell.cloneNode(true);
            content
              .querySelectorAll(".copy-control")
              .forEach((control) => control.remove());
            content.querySelectorAll("a").forEach((link) => {
              if (["Website", "LinkedIn"].includes(link.textContent.trim())) {
                link.replaceWith(document.createTextNode(link.href));
              }
            });
            const value = content.innerText.trim().replace(/\s+/g, " ");
            return value ? `${headers[index].innerText.trim()}: ${value}` : "";
          })
          .filter(Boolean)
          .join("\n");
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest(
          "[data-copy-text], [data-copy-row]",
        );
        if (!button) return;
        const text = button.hasAttribute("data-copy-row")
          ? companyRowText(button)
          : button.dataset.copyText;
        if (!text) return;

        let copied = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            copied = true;
          } else {
            copied = fallbackCopy(text);
          }
        } catch {
          copied = fallbackCopy(text);
        }

        const originalTitle = button.title;
        button.title = copied ? "Copied" : "Copy failed";
        button.classList.toggle("copied", copied);
        window.setTimeout(() => {
          button.title = originalTitle;
          button.classList.remove("copied");
        }, 1200);
      });
    </script>
  </body>
</html>
