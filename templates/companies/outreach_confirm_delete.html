{% extends "base.html" %} {% block title %}Delete {{ item_type }} | Job
Tracker{% endblock %} {% block content %}
<h1 class="page-title">Delete {{ item_type }}</h1>
<form method="post">
  {% csrf_token %}
  <p>Are you sure you want to delete <strong>{{ item_name }}</strong>?</p>
  <p>{{ warning }}</p>
  <div class="form-actions">
    <button class="button danger" type="submit">Delete</button>
    <a class="button secondary" href="{% url cancel_url cancel_pk %}">Cancel</a>
  </div>
</form>
{% endblock %}
