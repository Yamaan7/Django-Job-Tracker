{% extends "base.html" %} {% block title %}{{ page_title }} | Job Tracker
{%endblock %} {% block content %}
<h1 class="page-title">{{ page_title }} at {{ company.name }}</h1>
<form method="post">
  {% csrf_token %} {{ form.as_p }}
  <div class="form-actions">
    <button class="button" type="submit">{{ submit_label }}</button>
    <a class="button secondary" href="{% url 'company_detail' company.pk %}"
      >Cancel</a
    >
  </div>
</form>
{% endblock %}
