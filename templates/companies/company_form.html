{% extends "base.html" %} {% block title %}{{ page_title }} | Job Tracker
{%endblock %} {% block content %}
<h1 class="page-title">{{ page_title }}</h1>
<form method="post" class="company-form">
  {% csrf_token %} {{ form.as_p }}
  <div class="form-actions">
    <button class="button" type="submit">{{ submit_label }}</button>
    <a
      class="button secondary"
      href="{% if form.instance.pk %}{% url 'company_detail' form.instance.pk %}{% else %}{% url 'company_list' %}{% endif %}"
      >Cancel</a
    >
  </div>
</form>
{% endblock %}
